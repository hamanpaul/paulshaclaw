policy_profile: stage-driven
policy_version: 1.0.15
conventions_engine:
  repo: hamanpaul/paulsha-conventions
secret_scan:
  allow:
    - "docs/superpowers/**"
    - "docs/research/**"
    - "openspec/changes/archive/**"
preflight:
  steps:
    - name: openspec
      kind: validation
      argv: ["openspec", "validate", "--all", "--strict"]
      when_path_exists: "openspec"
      timeout_seconds: 300
    - name: tests
      kind: tests
      argv: ["./scripts/preflight-tests.sh"]
      timeout_seconds: 1800

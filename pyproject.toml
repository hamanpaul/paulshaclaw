[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paulshaclaw"
version = "0.1.0"
requires-python = ">=3.10"
description = "paulshaclaw agent workflow system"
# #125 Phase 1：memory 子系統由 paulsha-hippo 提供——pin 不可變 commit SHA
# （tag 僅人讀標記；PyPI 上線後改 version pin + hash，見 hippo-consumer spec）
dependencies = [
    "PyYAML>=6.0",
    "textual==0.61.1",
    # 兩個平面的 lifecycle 詞彙表必須逐字相等（由 tests/test_cortex_alignment.py
    # 守），故 pin 必須成對移動——升其中一個而不升另一個會讓對齊測試 FAIL。
    # v0.1.1 + lifecycle 詞彙聯集（hamanpaul/paulsha-hippo#126）
    "paulsha-hippo @ git+https://github.com/hamanpaul/paulsha-hippo@96513bcf298f22dfb94ff5e85c3836dd781486b0",
    # v0.1.3 + lifecycle 詞彙聯集（hamanpaul/paulsha-cortex#376）
    "paulsha-cortex @ git+https://github.com/hamanpaul/paulsha-cortex@ea4cd53bc49d8fb8e5024bbd6047d20bf21b6af5",
]

[project.scripts]
psc = "paulshaclaw.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["paulshaclaw*"]

[tool.setuptools.package-data]
# cockpit 視覺設計系統樣式表需隨套件出貨（CSS_PATH 於 wheel 安裝時才找得到）
"paulshaclaw.cockpit" = ["*.tcss"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "paulshaclaw"
version = "0.2.7"
requires-python = ">=3.10"
description = "paulshaclaw agent workflow system"
# #125 Phase 1：memory 子系統由 paulsha-hippo 提供——pin 不可變 commit SHA
# （tag 僅人讀標記；PyPI 上線後改 version pin + hash，見 hippo-consumer spec）
dependencies = [
    "PyYAML>=6.0",
    "textual==0.61.1",
    # 兩個平面的 lifecycle 詞彙表必須逐字相等（由 tests/test_cortex_alignment.py
    # 守），故 pin 必須成對移動——升其中一個而不升另一個會讓對齊測試 FAIL。
    # 尚未發版：詞彙聯集在 hippo main 但未收進 tag，下次 hippo 發版時改指向該 tag
    # 的 SHA（v0.1.1 + hamanpaul/paulsha-hippo#126）
    "paulsha-hippo @ git+https://github.com/hamanpaul/paulsha-hippo@96513bcf298f22dfb94ff5e85c3836dd781486b0",
    # v0.1.10+78＝origin/main 2026-09-10（#347：v0.1.10 tag 本身仍讀不了含
    # next_step_hint 的 coordinator 狀態檔；tag 僅人讀標記，pin 為不可變 SHA）
    "paulsha-cortex @ git+https://github.com/hamanpaul/paulsha-cortex@739cde17b5b891bcdd575cb98ea07280f428ebaf",
]

[project.scripts]
psc = "paulshaclaw.cli:main"
# #288：正式啟動路徑（release artifact 自足）；與 psc（cortex dispatcher）語意分離。
paulshaclaw = "paulshaclaw.launcher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["paulshaclaw*"]

[tool.setuptools.package-data]
# cockpit 視覺設計系統樣式表需隨套件出貨（CSS_PATH 於 wheel 安裝時才找得到）
"paulshaclaw.cockpit" = ["*.tcss"]
# core commands registry 定義檔需隨套件出貨（#334）
"paulshaclaw.core" = ["*.json"]
# deploy templates must be present in both wheel and sdist rebuilds
"paulshaclaw.deploy" = ["templates/**/*.tmpl"]

[tool.pytest.ini_options]
pythonpath = ["."]

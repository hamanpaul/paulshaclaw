name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install operator shell
        run: |
          python -m pip install --upgrade pip
          # -e . 會解析 pyproject 的 paulsha-hippo SHA pin（可解析性即 CI gate）
          python -m pip install -e .

      - name: Smoke import editable install runtime closure
        run: |
          python - <<'PY'
          import paulshaclaw
          import paulsha_cortex
          import paulsha_hippo
          import paulsha_hippo.lib.lifecycle
          import paulshaclaw.cost.config
          import paulshaclaw.cockpit
          import textual
          PY

      - name: Install test runner
        run: python -m pip install pytest

      - name: Check operator-shell import surface
        run: python scripts/check_import_surface.py

      - name: Run test suite
        # custom-skills 的測試不在 tests/ 底下，得明確列出。漏掉它等於讓
        # reply_bridge 的 facade 漂移把關（#90）永遠不會執行。
        run: python -m pytest tests/ custom-skills/bro/tests/ -q

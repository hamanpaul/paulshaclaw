name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install operator shell
        run: |
          python -m pip install --upgrade pip
          # -e . 會解析 pyproject 的 paulsha-hippo SHA pin（可解析性即 CI gate）
          python -m pip install -e .

      - name: Smoke import editable install runtime closure
        run: |
          python - <<'PY'
          import paulshaclaw
          import paulsha_cortex
          import paulsha_hippo
          import paulsha_hippo.lib.lifecycle
          import paulshaclaw.cost.config
          import paulshaclaw.cockpit
          import textual
          PY

      - name: Check operator-shell import surface
        run: python scripts/check_import_surface.py

      - name: Run test suite
        # pytest 不在 pyproject 依賴內，於此就地安裝（緊鄰其唯一用途）；
        # 獨立成安裝專用 step 會被 R-19 解析器判定為「僅命中安裝行，未確認
        # 實際測試執行」的 bypass 樣式（訊息明言下一版轉 FAIL），故與下方
        # 實際執行合併同一 step（同 paulsha-cortex persona-scope.yml 1.0.17
        # 同步工法的反向應用：該處是移除多餘安裝，這裡是安裝不可省但要與
        # 執行同 step）。custom-skills 的測試不在 tests/ 底下，得明確列出。
        # 漏掉它等於讓 reply_bridge 的 facade 漂移把關（#90）永遠不會執行。
        run: |
          python -m pip install pytest
          python -m pytest tests/ custom-skills/bro/tests/ -q

id: tc1p-readme-a-pipx-install
name: README §A pipx install without git (reproduces missing git RED regression)
topology:
  devices:
    dut:
      role: dut
      transport: docker
      image: ubuntu:24.04
      user: testuser
      uid: 1000
      network: bridge
artifact_role: historical
readme:
  revision: v0.2.7
  section: A
  prerequisite_declaration:
    source: issue-baseline
    packages:
    - python3
    - python3-venv
    - pipx
steps:
- id: S1P-0
  action: exec
  target: dut
  run_as: 0
  command: install -d -o 1000 -g 1000 /tmp/testpilot-home
  expected_exit_code: 0
- id: S1P-0a
  action: install_prerequisites
  target: dut
  run_as: 0
  packages_from: readme
  expected_exit_code: 0
- id: S1P-0b
  action: exec
  target: dut
  command: test -z "$(command -v git 2>/dev/null)"
  expected_exit_code: 0
- id: S1P-1
  action: exec
  target: dut
  command: cd /testpilot/artifacts && sha256sum -c checksums-sha256.txt --ignore-missing
  expected_exit_code: 0
- id: S1P-2
  action: exec
  target: dut
  command: HOME=/tmp/testpilot-home pipx install /testpilot/artifacts/paulshaclaw-0.2.7-py3-none-any.whl
  expected_exit_code: 0
  expected_red_exit_code: 1
  expected_red_stderr: Cannot find command 'git'
- id: S1P-3
  action: exec
  target: dut
  command: HOME=/tmp/testpilot-home bash -lc 'export HOME=/tmp/testpilot-home; export PATH=$HOME/.local/bin:$PATH; paulshaclaw
    --version'
  expected_exit_code: 0
  expected_red_exit_code: 127
  stdout_equals: paulshaclaw 0.2.7
pass_criteria:
- paulshaclaw 0.2.7

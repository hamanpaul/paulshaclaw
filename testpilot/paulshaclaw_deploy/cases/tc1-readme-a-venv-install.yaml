id: tc1-readme-a-venv-install
name: README §A venv install with declared prereqs (reproduces missing git RED regression)
topology:
  devices:
    dut:
      role: dut
      transport: docker
      image: ubuntu:24.04
      user: testuser
      uid: 1000
      network: bridge
image_comparison:
- image: ubuntu:22.04
  image_digest: sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
- image: ubuntu:24.04
  image_digest: sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
artifact_role: historical
readme:
  revision: v0.2.7
  section: A
  prerequisite_declaration:
    source: issue-baseline
    packages:
    - python3
    - python3-venv
steps:
- id: S1-0
  action: exec
  target: dut
  run_as: 0
  command: install -d -o 1000 -g 1000 /tmp/testpilot-home
  expected_exit_code: 0
- id: S1-0a
  action: install_prerequisites
  target: dut
  run_as: 0
  packages_from: readme
  expected_exit_code: 0
- id: S1-0b
  action: exec
  target: dut
  command: test -z "$(command -v git 2>/dev/null)"
  expected_exit_code: 0
- id: S1-1
  action: exec
  target: dut
  command: HOME=/tmp/testpilot-home python3 -m venv /tmp/testpilot-home/.venv-paulshaclaw
  expected_exit_code: 0
- id: S1-2
  action: exec
  target: dut
  command: /tmp/testpilot-home/.venv-paulshaclaw/bin/python -m pip install --upgrade pip
  expected_exit_code: 0
- id: S1-3
  action: exec
  target: dut
  command: cd /testpilot/artifacts && sha256sum -c checksums-sha256.txt --ignore-missing
  expected_exit_code: 0
- id: S1-4
  action: exec
  target: dut
  command: /tmp/testpilot-home/.venv-paulshaclaw/bin/python -m pip install /testpilot/artifacts/paulshaclaw-0.2.7-py3-none-any.whl
  expected_exit_code: 0
  expected_red_exit_code: 1
  expected_red_stderr: 'ERROR: Cannot find command ''git'' - do you have ''git'' installed and in your PATH?'
- id: S1-5
  action: exec
  target: dut
  command: test -x /tmp/testpilot-home/.venv-paulshaclaw/bin/paulshaclaw && test -x /tmp/testpilot-home/.venv-paulshaclaw/bin/psc
  expected_exit_code: 0
  expected_red_exit_code: 1
- id: S1-6
  action: exec
  target: dut
  command: /tmp/testpilot-home/.venv-paulshaclaw/bin/paulshaclaw --version
  expected_exit_code: 0
  expected_red_exit_code: 127
  stdout_equals: paulshaclaw 0.2.7
- id: S1-7
  action: exec
  target: dut
  command: /tmp/testpilot-home/.venv-paulshaclaw/bin/paulshaclaw status
  expected_exit_code: 0
  expected_red_exit_code: 127
- id: S1-8
  action: exec
  target: dut
  command: /tmp/testpilot-home/.venv-paulshaclaw/bin/paulshaclaw --help
  expected_exit_code: 0
  expected_red_exit_code: 127
- id: S1-9
  action: exec
  target: dut
  command: /tmp/testpilot-home/.venv-paulshaclaw/bin/psc
  expected_exit_code: 2
  expected_red_exit_code: 127
  output_contains: usage
- id: S1-10
  action: exec
  target: dut
  command: /tmp/testpilot-home/.venv-paulshaclaw/bin/python -m pip show paulshaclaw
  expected_exit_code: 0
  expected_red_exit_code: 1
  output_contains: 'Version: 0.2.7

    '
pass_criteria:
- paulshaclaw 0.2.7
- 'Version: 0.2.7'
